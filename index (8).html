<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KelStan Phonics Mastery Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --lab-navy:#12183B;
    --lab-navy-deep:#0B0F29;
    --mint:#2EC4B6;
    --mint-dark:#1EA79A;
    --spark:#FFD23F;
    --bubble:#FF6B9D;
    --coral:#FF5D5D;
    --cloud:#F7F9FC;
    --violet:#8B7CF6;
    --ink:#0B0F29;
    --blend-blue:#4DA3FF;
    --digraph-orange:#FFA53E;
    --diph-green:#5FD187;
    --rcon-teal:#2EC4B6;
    --silente-purple:#B18CFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Nunito',sans-serif;
    background:radial-gradient(1200px 800px at 20% -10%, #1C2456 0%, var(--lab-navy) 55%, var(--lab-navy-deep) 100%);
    color:var(--cloud);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',cursive;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:24px;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand .flask{font-size:26px;filter:drop-shadow(0 0 8px rgba(46,196,182,.6));}
  .brand-text{line-height:1.05;}
  .brand-text .k1{font-size:15px;font-weight:800;color:var(--spark);letter-spacing:.3px;}
  .brand-text .k2{font-size:11px;color:#9AA3D1;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
  .iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cloud);
    width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;}
  .iconbtn:active{transform:scale(.94);}

  /* ---------- generic card ---------- */
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:16px;}

  /* ---------- home / phase map ---------- */
  .hero{padding:6px 16px 4px;}
  .hero h1{font-size:26px;margin:6px 0 2px;color:#fff;}
  .hero p{margin:0;color:#B7BEE8;font-size:14px;font-weight:700;}
  .progress-wrap{padding:14px 16px 4px;}
  .progress-bar-outer{height:14px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.1);}
  .progress-bar-inner{height:100%;background:linear-gradient(90deg,var(--mint),var(--spark));border-radius:8px;transition:width .5s ease;}
  .progress-label{font-size:12px;color:#9AA3D1;font-weight:800;margin-top:6px;text-align:right;}

  .phase-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px 20px;}
  .phase-node{position:relative;border-radius:18px;padding:14px 12px;cursor:pointer;border:2px solid transparent;
    background:linear-gradient(160deg, rgba(46,196,182,.18), rgba(139,124,246,.10));transition:transform .15s ease;}
  .phase-node:active{transform:scale(.96);}
  .phase-node.locked{background:rgba(255,255,255,.04);opacity:.55;cursor:not-allowed;}
  .phase-node.current{border-color:var(--spark);box-shadow:0 0 0 3px rgba(255,210,63,.18);}
  .phase-node.mastered{border-color:var(--mint);}
  .phase-node .pnum{font-size:11px;font-weight:800;color:var(--spark);letter-spacing:.5px;}
  .phase-node .ptitle{font-size:14.5px;font-weight:800;margin:2px 0 4px;color:#fff;line-height:1.15;}
  .phase-node .pfocus{font-size:11px;color:#AAB2DE;font-weight:700;}
  .phase-node .plock{position:absolute;top:10px;right:10px;font-size:16px;}
  .phase-node .stars{margin-top:8px;font-size:12px;letter-spacing:1px;color:var(--spark);}

  /* ---------- round map ---------- */
  .section-title{padding:14px 16px 2px;font-size:20px;color:#fff;}
  .section-sub{padding:0 16px 10px;color:#9AA3D1;font-size:13px;font-weight:700;}
  .round-list{padding:6px 16px 20px;display:flex;flex-direction:column;gap:10px;}
  .round-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    border-radius:16px;padding:12px 14px;cursor:pointer;}
  .round-row.locked{opacity:.5;cursor:not-allowed;}
  .round-row.done{border-color:var(--mint);}
  .round-badge{width:42px;height:42px;border-radius:12px;background:var(--lab-navy-deep);border:2px solid var(--mint);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Baloo 2';font-size:16px;flex-shrink:0;}
  .round-row.locked .round-badge{border-color:#555a86;}
  .round-info{flex:1;}
  .round-info .rt{font-weight:800;font-size:14.5px;color:#fff;}
  .round-info .rs{font-size:12px;color:#9AA3D1;font-weight:700;}
  .round-stars{font-size:14px;color:var(--spark);letter-spacing:1px;}
  .backbtn{margin:10px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;
    padding:9px 14px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}

  /* ---------- game screen ---------- */
  .game-topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;}
  .exit-x{font-size:20px;color:#B7BEE8;cursor:pointer;}
  .qprogress-outer{flex:1;height:12px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;}
  .qprogress-inner{height:100%;background:linear-gradient(90deg,var(--bubble),var(--spark));border-radius:8px;transition:width .3s ease;}
  .qcount{font-size:12px;font-weight:800;color:#B7BEE8;min-width:42px;text-align:right;}

  .beaker-wrap{display:flex;justify-content:center;padding:6px 0 10px;}
  .beaker{font-size:44px;filter:drop-shadow(0 0 14px rgba(46,196,182,.55));}

  .game-card{margin:0 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:20px 16px;text-align:center;}
  .focus-chip{display:inline-block;background:rgba(255,210,63,.14);color:var(--spark);font-weight:800;font-size:11.5px;
    padding:5px 12px;border-radius:20px;margin-bottom:10px;letter-spacing:.3px;}
  .prompt{font-size:15px;color:#D7DBFB;font-weight:800;margin-bottom:14px;}
  .sound-btn{background:linear-gradient(160deg,var(--mint),var(--mint-dark));border:none;color:#04211d;font-weight:900;
    font-size:26px;width:78px;height:78px;border-radius:50%;cursor:pointer;box-shadow:0 8px 0 #0d6e64,0 10px 18px rgba(0,0,0,.3);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
  .sound-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #0d6e64;}
  .picture{font-size:64px;margin:6px 0 14px;}

  .mcq-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .mcq-opt{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);color:#fff;font-family:'Baloo 2';
    font-size:19px;font-weight:700;padding:16px 8px;border-radius:16px;cursor:pointer;letter-spacing:.5px;}
  .mcq-opt:active{transform:scale(.96);}
  .mcq-opt.correct{background:rgba(46,196,182,.28);border-color:var(--mint);}
  .mcq-opt.wrong{background:rgba(255,93,93,.25);border-color:var(--coral);}

  .build-row{display:flex;justify-content:center;gap:8px;margin:14px 0;flex-wrap:wrap;min-height:56px;}
  .slot{width:42px;height:50px;border-bottom:3px solid var(--mint);display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-size:24px;font-weight:700;color:#fff;}
  .tiles-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .tile{background:linear-gradient(160deg,var(--violet),#6a58d8);color:#fff;font-family:'Baloo 2';font-size:21px;font-weight:700;
    width:44px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 0 #4c3ea3;user-select:none;}
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 #4c3ea3;}
  .tile.used{opacity:.25;pointer-events:none;}

  .spell-row{display:flex;justify-content:center;gap:6px;margin:14px 0;flex-wrap:wrap;}
  .letterbox{width:38px;height:46px;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05);
    color:#fff;font-family:'Baloo 2';font-size:20px;text-align:center;font-weight:700;}
  .letterbox:focus{outline:none;border-color:var(--spark);}
  .kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;}
  .kb button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:9px;
    padding:9px 0;font-family:'Baloo 2';font-size:15px;cursor:pointer;}
  .kb button:active{background:rgba(255,255,255,.2);}

  .primary-btn{width:100%;margin-top:16px;background:linear-gradient(160deg,var(--spark),#f2b400);border:none;color:#3a2900;
    font-family:'Baloo 2';font-weight:800;font-size:17px;padding:14px;border-radius:16px;cursor:pointer;
    box-shadow:0 6px 0 #b5820a;}
  .primary-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b5820a;}
  .primary-btn:disabled{opacity:.35;box-shadow:none;}
  .ghost-btn{width:100%;margin-top:10px;background:transparent;border:2px solid rgba(255,255,255,.18);color:#cfd3f7;
    font-weight:800;font-size:14px;padding:11px;border-radius:14px;cursor:pointer;}

  /* ---------- feedback / correction overlay ---------- */
  .feedback-flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5;}
  .flash-emoji{font-size:90px;opacity:0;animation:pop .7s ease forwards;}
  @keyframes pop{0%{opacity:0;transform:scale(.4);}40%{opacity:1;transform:scale(1.15);}100%{opacity:0;transform:scale(1);}}

  .overlay{position:fixed;inset:0;background:rgba(4,6,20,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;
    justify-content:center;z-index:20;}
  .sheet{width:100%;max-width:520px;background:#171E45;border-radius:26px 26px 0 0;padding:22px 18px 26px;border-top:1px solid rgba(255,255,255,.12);
    box-shadow:0 -10px 40px rgba(0,0,0,.4);}
  .sheet h3{margin:0 0 4px;font-size:20px;}
  .sheet .sub{color:#9AA3D1;font-size:13px;font-weight:700;margin-bottom:14px;}
  .chunk-row{display:flex;justify-content:center;gap:6px;margin:16px 0;flex-wrap:wrap;}
  .chunk{font-family:'Baloo 2';font-size:26px;font-weight:800;padding:8px 10px;border-radius:12px;color:#0b0f29;cursor:pointer;}
  .chunk-letter{background:#e9ebfb;}
  .chunk-blend{background:var(--blend-blue);color:#04162c;}
  .chunk-digraph{background:var(--digraph-orange);}
  .chunk-diph{background:var(--diph-green);}
  .chunk-rcon{background:var(--rcon-teal);}
  .chunk-silente{background:var(--silente-purple);}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;font-size:11px;color:#9AA3D1;font-weight:700;}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block;}

  /* ---------- round result ---------- */
  .result-wrap{text-align:center;padding:30px 20px;}
  .result-emoji{font-size:80px;}
  .stars-big{font-size:34px;letter-spacing:6px;margin:10px 0;}
  .result-title{font-size:24px;margin:0 0 4px;}
  .result-sub{color:#B7BEE8;font-size:14px;font-weight:700;margin-bottom:6px;}
  .score-pill{display:inline-block;background:rgba(255,255,255,.08);border-radius:20px;padding:6px 16px;font-weight:800;
    font-size:13px;color:#fff;margin-bottom:18px;}
  .missed-box{text-align:left;background:rgba(255,255,255,.05);border-radius:16px;padding:14px;margin:14px 0;}
  .missed-box .mt{font-weight:800;font-size:13px;color:var(--spark);margin-bottom:8px;}
  .missed-word{display:inline-block;background:rgba(255,93,93,.15);color:#ffb3b3;border-radius:10px;padding:4px 10px;
    margin:3px 4px 0 0;font-family:'Baloo 2';font-weight:700;font-size:14px;}

  .confetti{position:fixed;top:-10px;font-size:20px;pointer-events:none;animation:fall linear forwards;z-index:30;}
  @keyframes fall{to{transform:translateY(110vh) rotate(400deg);opacity:.2;}}

  ::selection{background:var(--mint);color:#04211d;}
  input:focus{outline:none;}
</style>
</head>

<script>
(function(){
"use strict";

/* ============================================================
   PHONICS SOUND ANALYZER  (classes each word by sound-chunks)
   ============================================================ */
const CHUNK_PATTERNS = [
  {re:/^(tch|dge)/, cls:'chunk-digraph'},
  {re:/^(sh|ch|th|wh|ck|ph|ng)/, cls:'chunk-digraph'},
  {re:/^(ai|ay|ee|ea|oa|oe|ue|oo)/, cls:'chunk-diph'},
  {re:/^(oi|oy|ou|ow)/, cls:'chunk-diph'},
  {re:/^(ar|er|ir|or|ur)/, cls:'chunk-rcon'},
  {re:/^(bl|cl|fl|gl|pl|sl|br|cr|dr|fr|gr|pr|sc|sk|sm|sn|sp|st|sw|tr|tw)/, cls:'chunk-blend'},
  {re:/^(nd|mp|nk|lt|ft|nt)/, cls:'chunk-blend'},
];
function analyzeWord(word){
  const w = word.toLowerCase();
  const chunks = [];
  let i = 0;
  while(i < w.length){
    const rest = w.slice(i);
    let matched = false;
    // silent final e
    if(i === w.length-1 && w[i]==='e' && w.length>3 && !/[aeiou]/.test(w[i-1]) && chunks.length){
      chunks.push({text:'e', cls:'chunk-silente'}); i++; matched = true;
    }
    if(!matched){
      for(const p of CHUNK_PATTERNS){
        const m = rest.match(p.re);
        if(m){ chunks.push({text:m[0], cls:p.cls}); i += m[0].length; matched = true; break; }
      }
    }
    if(!matched){ chunks.push({text:w[i], cls:'chunk-letter'}); i++; }
  }
  return chunks;
}

/* ============================================================
   WORD BANKS — 20 phases, real phonics progression
   ============================================================ */

  cab:'🚕',tab:'📑',wax:'🕯️',fax:'📠',tax:'💰',max:'📈',sad:'😢',bad:'👎',dad:'👨',had:'🤲',

  rip:'💔',zip:'🤐',pig:'🐷',big:'📏',dig:'⛏️',fig:'🍈',wig:'💇',win:'🏆',pin:'📌',tin:'🥫',
  fin:'🐟',bin:'🗑️',six:'6️⃣',mix:'🥣',fix:'🔧',lid:'🫙',did:'✔️',hid:'🙈',kid:'🧒',hot:'🔥',

  hop:'🐇',mop:'🧹',top:'🔝',pop:'🎈',cop:'👮',sob:'😭',job:'💼',cob:'🌽',rob:'🦹',box:'📦',
  fox:'🦊',mom:'👩',got:'📥',nod:'🙆',pod:'🫛',rod:'🎣',cup:'☕',pup:'🐶',cut:'✂️',but:'➡️',

  cub:'🐻',rub:'🧽',tub:'🛁',hug:'🤗',bug:'🐛',mug:'☕',rug:'🟫',tug:'🪢',black:'⬛',clap:'👏',

  gate:'🚪',cave:'🕳️',wave:'🌊',name:'🏷️',game:'🎮',tape:'📼',ride:'🚴',hide:'🙈',time:'⏰',
  nine:'9️⃣',note:'🎵',rope:'🪢',nose:'👃',rose:'🌹',hole:'🕳️',cube:'🧊',tube:'🧪',mule:'🐴',
  rule:'📏',rain:'🌧️',train:'🚂',tail:'🐕',day:'🌞',play:'🎲',tree:'🌳',bee:'🐝',feet:'🦶',
  seed:'🌱',boat:'⛵',coat:'🧥',goat:'🐐',snow:'❄️',blue:'🔵',glue:'🧴',coin:'🪙',boy:'👦',
  joy:'😊',house:'🏠',mouse:'🐭',cloud:'☁️',cow:'🐄',owl:'🦉',car:'🚗',star:'⭐',farm:'🚜',
  bird:'🐦',girl:'👧',corn:'🌽',storm:'⛈️',turn:'🔄',nurse:'👩‍⚕️',watch:'⌚',bridge:'🌉',
  ring2:'💍',knee:'🦵',knot:'🪢',write:'✍️',sunset:'🌇',backpack:'🎒',cupcake:'🧁',rainbow:'🌈',
  football:'🏈',popcorn:'🍿',sunflower:'🌻',starfish:'⭐',snowman:'⛄',firefly:'✨',ladybug:'🐞',
  butterfly:'🦋',lighthouse:'🏮',baby:'👶',tiger:'🐯',music:'🎵',robot:'🤖',pilot:'✈️',spider:'🕷️',
  eagle:'🦅',banana:'🍌',elephant:'🐘',dinosaur:'🦕',umbrella:'☂️',hospital:'🏥',alligator:'🐊',
  octopus:'🐙',tomato:'🍅',potato:'🥔',camera:'📷',hamburger:'🍔',helicopter:'🚁',kangaroo:'🦘',
  gorilla:'🦍',tornado:'🌪️',volcano:'🌋',calendar:'📅',telephone:'☎️',teacher:'🍎',singer:'🎤',
  farmer:'🚜',baker:'🍞',dancer:'💃'
};
function emojiFor(w){ return EMOJI[w.toLowerCase()] || '🔤'; }

const PHASES = [
{ title:'Sound Seeds', focus:'Letter sounds A–Z & 1-letter words', bank:
  Object.keys(LETTER_KEYWORDS).concat(['a','i']), letterPhase:true },
{ title:'Tiny Two-Letter Words', focus:'2-letter real words', bank:
  ['an','am','at','as','in','is','it','if','on','up','us','my','by','go','no','so','hi','be','he','we','me','do','to','of','or'] },
{ title:'Short A Beakers', focus:'3-letter CVC · short a', bank:

(function(){
  const all = [];
  for(let i=0;i<PHASES.length-1;i++){ if(!PHASES[i].letterPhase) all.push(...PHASES[i].bank); }
  PHASES[PHASES.length-1].bank = all;
})();

/* Build 250-word question list per phase (10 rounds x 25) by cycling the bank
   through varied question types so mastery repetition serves learning. */
function buildPhaseWords(phaseIdx){
  const ph = PHASES[phaseIdx];
  const total = 250;
  const out = [];
  const bank = ph.bank;
  let cursor = 0;
  const shuffledPasses = [];
  while(out.length < total){
    if(cursor % bank.length === 0){
      shuffledPasses.push(shuffle(bank.slice()));
    }
    const passArr = shuffledPasses[shuffledPasses.length-1];
    const w = passArr[cursor % bank.length];
    out.push(w);
    cursor++;
  }
  return out.slice(0, total);
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

/* ============================================================
   GAME ENGINE
   ============================================================ */
function startRound(phaseIdx, roundIdx){
  const ph = PHASES[phaseIdx];
  const words = buildPhaseWords(phaseIdx).slice(roundIdx*25, roundIdx*25+25);
  game = {
    phaseIdx, roundIdx, ph,
    queue: words.map((w,i)=>({ word:w, type: i%3, idx:i })),
    qIndex:0,
    correctFirstTry:0,
    missed:[],
    awaitingRetry:false,
    locked:false,
  };
  route = {screen:'game'};
  render();
}

function currentItem(){ return game.queue[game.qIndex]; }

function letterOptionsFor(letter){
  const letters = Object.keys(LETTER_KEYWORDS);
  const opts = new Set([letter]);
  while(opts.size<4){ opts.add(letters[Math.floor(Math.random()*letters.length)]); }
  return shuffle([...opts]);
}
function spellingDistractors(word){
  const opts = new Set([word]);
  const bank = game.ph.bank.filter(w=>typeof w==='string' && w.length===word.length && w!==word);
  shuffle(bank);
  for(const b of bank){ if(opts.size>=4) break; opts.add(b); }
  while(opts.size<4){
    const arr = word.split('');
    const i = Math.floor(Math.random()*arr.length);
    const alt = 'abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random()*26)];
    arr[i]=alt;
    opts.add(arr.join(''));
  }
  return shuffle([...opts]);
}

function renderGame(){
  if(!game) return renderHome();
  const item = currentItem();
  const total = game.queue.length;
  const pct = Math.round((game.qIndex/total)*100);
  const isLetterPhase = !!game.ph.letterPhase;

  let bodyHtml = '';
  const word = item.word;

  if(isLetterPhase){
    const keyword = LETTER_KEYWORDS[word] || null;
    if(keyword){
      const opts = letterOptionsFor(word);
      bodyHtml = `
        <div class="focus-chip">${game.ph.focus}</div>
        <div class="prompt">Which letter makes this sound?</div>
        <div class="picture">${emojiFor(keyword.toLowerCase())||'🔤'}</div>
        <div class="sound-btn" id="soundBtn">🔊</div>
        <div class="mcq-grid">${opts.map(o=>`<div class="mcq-opt" data-ans="${o}">${o.toUpperCase()}</div>`).join('')}</div>
      `;
    } else {
      // the bonus real 1-letter words "a" / "i"
      const opts = shuffle([word, word==='a'?'i':'a', 'o','u']);
      bodyHtml = `
        <div class="focus-chip">${game.ph.focus}</div>
        <div class="prompt">Which word says "${word.toUpperCase()}"?</div>
        <div class="sound-btn" id="soundBtn">🔊</div>
        <div class="mcq-grid">${opts.map(o=>`<div class="mcq-opt" data-ans="${o}">${o.toUpperCase()}</div>`).join('')}</div>
      `;
    }
  } else if(item.type===0){
    // Listen & Choose (MCQ)
    const opts = spellingDistractors(word);
    bodyHtml = `
      <div class="focus-chip">${game.ph.focus}</div>
      <div class="prompt">Listen, then tap the correct spelling</div>
      <div class="picture">${emojiFor(word)}</div>
      <div class="sound-btn" id="soundBtn">🔊</div>
      <div class="mcq-grid">${opts.map(o=>`<div class="mcq-opt" data-ans="${o}">${o}</div>`).join('')}</div>
    `;
  } else if(item.type===1){
    // Build the word from scrambled tiles
    const letters = shuffle(word.split(''));
    bodyHtml = `
      <div class="focus-chip">${game.ph.focus}</div>
      <div class="prompt">Tap the letters in order to build the word</div>
      <div class="picture">${emojiFor(word)}</div>
      <div class="sound-btn" id="soundBtn">🔊</div>
      <div class="build-row" id="buildRow">${word.split('').map(()=>`<div class="slot"></div>`).join('')}</div>
      <div class="tiles-row" id="tilesRow">${letters.map((l,i)=>`<div class="tile" data-l="${l}" data-i="${i}">${l}</div>`).join('')}</div>
    `;
  } else {
    // Type & Spell
    bodyHtml = `
      <div class="focus-chip">${game.ph.focus}</div>
      <div class="prompt">Listen carefully and spell the word</div>
      <div class="picture">${emojiFor(word)}</div>
      <div class="sound-btn" id="soundBtn">🔊</div>
      <div class="spell-row" id="spellRow">${word.split('').map((_,i)=>`<input class="letterbox" maxlength="1" data-i="${i}">`).join('')}</div>
      <button class="primary-btn" id="checkSpell">Check my spelling</button>
    `;
  }

  appEl.innerHTML = `
    <div class="game-topbar">
      <div class="exit-x" id="exitGame">✕</div>
      <div class="qprogress-outer"><div class="qprogress-inner" style="width:${pct}%"></div></div>
      <div class="qcount">${game.qIndex+1}/${total}</div>
    </div>
    <div class="beaker-wrap"><div class="beaker">🧪</div></div>
    <div class="game-card">${bodyHtml}</div>
  `;

  document.getElementById('exitGame').onclick = ()=>{
    if(confirm('Leave this round? Your progress on this round will be lost.')){ route={screen:'phase', phaseIdx:game.phaseIdx}; game=null; render(); }
  };
  const speakWord = isLetterPhase ? (LETTER_KEYWORDS[word] ? `${word.toUpperCase()}... like ${LETTER_KEYWORDS[word]}` : word) : word;
  const sb = document.getElementById('soundBtn');
  if(sb){ sb.onclick = ()=>speak(speakWord); setTimeout(()=>speak(speakWord), 350); }

  if(!isLetterPhase && item.type===1){ wireBuildTiles(word); }
  if(!isLetterPhase && item.type===2){ wireSpellCheck(word); }
  appEl.querySelectorAll('.mcq-opt').forEach(el=>{
    el.onclick = ()=> handleAnswer(el.dataset.ans === word, el.dataset.ans, word, el);
  });
}

function wireBuildTiles(word){
  const built = [];
  const slotEls = ()=>document.querySelectorAll('#buildRow .slot');
  document.querySelectorAll('#tilesRow .tile').forEach(t=>{
    t.onclick = ()=>{
      if(t.classList.contains('used')) return;
      built.push(t.dataset.l);
      t.classList.add('used');
      const slots = slotEls();
      slots[built.length-1].textContent = t.dataset.l;
      if(built.length === word.length){
        const attempt = built.join('');
        setTimeout(()=> handleAnswer(attempt===word, attempt, word, null), 300);
      }
    };
  });
}
function wireSpellCheck(word){
  const boxes = document.querySelectorAll('#spellRow .letterbox');
  boxes.forEach((b,i)=>{
    b.oninput = ()=>{ b.value = b.value.slice(-1); if(b.value && boxes[i+1]) boxes[i+1].focus(); };
  });
  document.getElementById('checkSpell').onclick = ()=>{
    const attempt = Array.from(boxes).map(b=>b.value.toLowerCase()||'_').join('');
    handleAnswer(attempt===word, attempt, word, null);
  };
}

function handleAnswer(isCorrect, given, word, el){
  if(el){
    if(isCorrect){ el.classList.add('correct'); }
    else{
      el.classList.add('wrong');
      appEl.querySelectorAll('.mcq-opt').forEach(o=>{ if(o.dataset.ans===word) o.classList.add('correct'); });
    }
  }
  if(isCorrect){
    spawnFlash('🌟');
    game.correctFirstTry++;
    speak('Great job!', 1.05);
    setTimeout(advance, 700);
  } else {
    speak('Not quite. Lets learn it.', 0.9);
    game.missed.push(word);
    setTimeout(()=> showCorrection(word), 500);
  }
}

function showCorrection(word){
  const chunks = analyzeWord(word);
  const legendUsed = new Set(chunks.map(c=>c.cls));
  const legendMap = {
    'chunk-letter':['#e9ebfb','Single letter sound'],
    'chunk-blend':['var(--blend-blue)','Blend'],
    'chunk-digraph':['var(--digraph-orange)','Digraph'],
    'chunk-diph':['var(--diph-green)','Vowel team / diphthong'],
    'chunk-rcon':['var(--rcon-teal)','R-controlled'],
    'chunk-silente':['var(--silente-purple)','Silent e'],
  };
  let legendHtml = '';
  legendUsed.forEach(cls=>{ const [color,label] = legendMap[cls]; legendHtml += `<span><span class="dot" style="background:${color}"></span>${label}</span>`; });

  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <h3>Let's sound it out 🔍</h3>
      <div class="sub">Tap each chunk to hear it, then the whole word.</div>
      <div class="chunk-row" id="chunkRow">${chunks.map(c=>`<div class="chunk ${c.cls}" data-t="${c.text}">${c.text}</div>`).join('')}</div>
      <div class="legend">${legendHtml}</div>
      <button class="primary-btn" id="replayWhole">🔊 Hear the whole word</button>
      <button class="ghost-btn" id="gotIt">Got it — keep going</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('.chunk').forEach(c=>{ c.onclick=()=>speak(c.dataset.t, 0.6); });
  document.getElementById('replayWhole').onclick = ()=>speak(word, 0.7);
  document.getElementById('gotIt').onclick = ()=>{ overlay.remove(); advance(); };
  setTimeout(()=>speak(word,0.7), 300);
}

function advance(){
  game.qIndex++;
  if(game.qIndex >= game.queue.length){ finishRound(); }
  else{ render(); }
}

function finishRound(){
  const score = game.correctFirstTry;
  let stars = 1;
  if(score>=23) stars=3;
  else if(score>=18) stars=2;
  else stars=1;
  const excellent = stars===3;

  const pp = progress.phases[game.phaseIdx];
  if(stars > pp.stars[game.roundIdx]) pp.stars[game.roundIdx] = stars;
  if(excellent && game.roundIdx+1 > pp.unlockedRounds){ pp.unlockedRounds = Math.min(10, game.roundIdx+2); }
  const phaseMastered = pp.stars.every(s=>s===3);
  if(phaseMastered && progress.unlockedPhase===game.phaseIdx && game.phaseIdx < PHASES.length-1){
    progress.unlockedPhase = game.phaseIdx+1;
  }
  saveProgress();

  route = {screen:'result', score, stars, excellent, phaseMastered};
  render();
  if(excellent) spawnConfetti();
}

  const uniqueMissed = [...new Set(game.missed)];

  const title = excellent ? 'Excellent! Round Mastered!' : (stars===2 ? 'Good try — aim for Excellent!' : 'Keep practicing!');
  const sub = excellent
    ? (phaseMastered ? 'You mastered the whole phase! New phase unlocked 🎉' : 'Next round unlocked!')
    : 'You need Excellent (23/25) to unlock the next round.';

  appEl.innerHTML = `
    <div class="result-wrap">
      <div class="result-emoji">${emoji}</div>
      <div class="stars-big">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <h2 class="result-title">${title}</h2>
      <div class="result-sub">${sub}</div>
      <div class="score-pill">${score} / 25 correct on first try</div>
      ${uniqueMissed.length ? `<div class="missed-box"><div class="mt">Words to remember:</div>${uniqueMissed.map(w=>`<span class="missed-word">${w}</span>`).join('')}</div>` : ''}
      <button class="primary-btn" id="retryBtn">${excellent ? (game.roundIdx<9 ? 'Next round →' : 'Back to phase map') : 'Retry this round'}</button>
      <button class="ghost-btn" id="mapBtn">View phase map</button>
    </div>
  `;
  document.getElementById('retryBtn').onclick = ()=>{
    if(excellent && game.roundIdx<9){ startRound(game.phaseIdx, game.roundIdx+1); }
    else if(excellent){ route={screen:'phase', phaseIdx:game.phaseIdx}; game=null; render(); }
    else { startRound(game.phaseIdx, game.roundIdx); }
  };
  document.getElementById('mapBtn').onclick = ()=>{ route={screen:'phase', phaseIdx:game.phaseIdx}; game=null; render(); };
}

})();
</script>
</body>
</html>
